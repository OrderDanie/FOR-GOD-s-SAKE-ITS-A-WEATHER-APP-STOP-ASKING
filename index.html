<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="viewport">
        <header class="navbar">
            <div class="navbar-brand">
                <h1>weather</h1>
            </div>
            <div class="navbar-controls">
                <button class="btn-control" id="btnTheme" aria-label="theme">theme</button>
                <button class="btn-control" id="btnUnit" aria-label="unit">C</button>
            </div>
        </header>

        <main class="content">
            <section class="search-area">
                <div class="search-field">
                    <input 
                        type="text" 
                        id="inputSearch" 
                        placeholder="find a place..." 
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <div id="dropdownSuggestions" class="suggestions-drop"></div>
            </section>

            <section id="sectionCurrent" class="weather-now">
                <div class="location-header">
                    <h2 id="txtLocation">loading...</h2>
                    <span id="txtTime" class="time-now"></span>
                </div>

                <div class="temp-display">
                    <div class="temp-main">
                        <span id="valTemp" class="value">--</span>
                        <span class="unit" id="unitLabel">C</span>
                    </div>
                    <div class="condition-info">
                        <div id="iconWeather" class="icon-box">--</div>
                        <div class="text-info">
                            <p id="txtCondition">--</p>
                            <p id="txtRange" class="range">--</p>
                        </div>
                    </div>
                </div>

                <div class="vibe-meter">
                    <label>how's the day</label>
                    <div class="meter-track">
                        <div id="meterFill" class="meter-bar"></div>
                    </div>
                    <span id="valVibe" class="meter-text">--/10</span>
                </div>

                <div class="details-grid">
                    <div class="detail-item">
                        <span class="detail-name">feels like</span>
                        <span id="valFeels" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">humidity</span>
                        <span id="valHumid" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">wind</span>
                        <span id="valWind" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">direction</span>
                        <span id="valDir" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">pressure</span>
                        <span id="valPress" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">clouds</span>
                        <span id="valCloud" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">uv index</span>
                        <span id="valUv" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">visibility</span>
                        <span id="valVis" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">rain chance</span>
                        <span id="valRain" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">sunrise</span>
                        <span id="valSunrise" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">sunset</span>
                        <span id="valSunset" class="detail-num">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-name">dew point</span>
                        <span id="valDew" class="detail-num">--</span>
                    </div>
                </div>
            </section>

            <section id="sectionHourly" class="forecast-hours">
                <h3>next 24 hours</h3>
                <div id="containerHours" class="hours-scroll"></div>
            </section>

            <section id="sectionDaily" class="forecast-days">
                <h3>7 day forecast</h3>
                <div id="containerDays" class="days-grid"></div>
            </section>

            <section id="sectionAlerts" class="alerts-box"></section>
        </main>

        <footer class="footer">
            <p>no keys. no tracking. just weather.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
